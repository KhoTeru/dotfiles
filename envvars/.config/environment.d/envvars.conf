# XDG Directories
XDG_DATA_HOME="$HOME/.local/share"
XDG_CONFIG_HOME="$HOME/.config"
XDG_STATE_HOME="$HOME/.local/state"
XDG_CACHE_HOME="$HOME/.cache"
XDG_SCREENSHOTS_DIR="/storage/teru/Documents/Syncthing/Sync/Pictures/Screenshots"

# Path
GOPATH="$XDG_DATA_HOME/go"
#GEM_HOME="$(gem env user_gemhome)"
#PATH="$PATH:$GOPATH/bin:$GEM_HOME/bin:$HOME/.local/bin"

# Config directories
DOCKER_CONFIG="$XDG_CONFIG_HOME/docker"
CARGO_HOME="$XDG_DATA_HOME/cargo"
RUSTUP_HOME="$XDG_DATA_HOME/rustup"
DOTNET_CLI_HOME="$XDG_DATA_HOME/dotnet"
XAUTHORITY="$XDG_RUNTIME_DIR/Xauthority"
XINITRC="$XDG_CONFIG_HOME/X11/xinitrc"
PYTHON_HISTORY="/dev/null"
#PYTHONSTARTUP=/etc/python/pythonrc
WINEPREFIX="$XDG_DATA_HOME/wine"
GNUPGHOME="$XDG_DATA_HOME/gnupg"
ZDOTDIR="$XDG_CONFIG_HOME/zsh"

# Themes
GTK2_RC_FILES="$XDG_CONFIG_HOME/gtk-2.0/gtkrc"
XCURSOR_PATH="$XDG_DATA_HOME/icons:$HOME/.icons:/usr/share/icons"
FZF_DEFAULT_OPTS=--color=bg+:#313244,bg:#1E1E2E,spinner:#F5E0DC,hl:#F38BA8,fg:#CDD6F4,header:#F38BA8,info:#CBA6F7,pointer:#F5E0DC,marker:#B4BEFE,fg+:#CDD6F4,prompt:#CBA6F7,hl+:#F38BA8,selected-bg:#45475A,border:#6C7086,label:#CDD6F4

# Pager options
MANPAGER="bat -plman"

# Editor
EDITOR="nvim"

# Games (enabling Wayland disables Steam Overlay)
PROTON_ENABLE_WAYLAND=1
PROTON_FSR4_UPGRADE=1
PROTON_ENABLE_HDR=1
MESA_SHADER_CACHE_MAX_SIZE=12G

# Options for tiling window managers
# _JAVA_OPTIONS="-Djava.util.prefs.userRoot="$XDG_CONFIG_HOME"/java -Dawt.useSystemAAFontSettings=on -Dswing.aatext=true"
# AWT_TOOLKIT=MToolKit
# _JAVA_AWT_WM_NONREPARENTING=1

# Others
LESSHISTFILE="$XDG_STATE_HOME/less/history"
PASSWORD_STORE_DIR="$XDG_DATA_HOME/pass"
ICEAUTHORITY="$XDG_CACHE_HOME/ICEauthority"
#CUDA_CACHE_PATH="$XDG_CACHE_HOME/nv"
#OMPI_MCA_opal_warn_on_missing_libcuda="0"
MOZ_ENABLE_WAYLAND=1
