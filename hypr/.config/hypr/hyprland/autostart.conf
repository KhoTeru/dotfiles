# ## Autostart applications
exec-once = wmname LG3D
exec-once = systemctl --user import-environment XDG_SESSION_TYPE XDG_CURRENT_DESKTOP WAYLAND_DISPLAY
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = hyprpaper
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dunst > /tmp/dunst.log
exec-once = waybar > /tmp/waybar.log

exec-once = sleep 5 && keepassxc
exec-once = sleep 5 && localsend autostart
