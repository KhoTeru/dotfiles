# Exec applications
bind = SUPER, Return, exec, kitty
bind = ALT + SUPER, Space, exec, rofi -show drun
bind = SHIFT + SUPER, c, exec, hyprpicker
bind = SUPER, l, exec, hyprlock --immediate
bind = SUPER, Space, exec, hyprctl switchxkblayout evision-rgb-keyboard next
#bind = SUPER, Space, exec, hyprctl switchxkblayout evision-rgb-keyboard next

bind = SHIFT + SUPER, s, exec, grimblast --notify --freeze copysave area "$XDG_SCREENSHOTS_DIR/$(date -Iseconds).png" # Selected region screenshot
bind = SUPER, Print, exec, grimblast --notify copysave output "$XDG_SCREENSHOTS_DIR/$(date -Iseconds).png" # Fullscreen screenshot
bind = , Print, exec, grimblast --notify copy output "$XDG_SCREENSHOTS_DIR/$(date -Iseconds).png" # Copy screenshot to clipboard

bind = ALT + SUPER + CTRL, f, exec, zen-browser
bind = ALT + SUPER + CTRL, k, exec, keepassxc
bind = ALT + SUPER + CTRL, o, exec, obsidian
bind = ALT + SUPER + CTRL, v, exec, env GTK_THEME=Adwaita:dark virt-manager

# Exits things
bind = SUPER, q, killactive,
bind = ALT + SUPER, q, exit,

# Sets window mode
bind = SUPER, s, setfloating,
bind = SUPER, t, settiled,
bind = SUPER, f, fullscreen, 0
bind = SUPER + SHIFT, t, pseudo, # dwindle

# Preselect directions (dwindle)
bind = SUPER + CTRL, left, layoutmsg, preselect l
bind = SUPER + CTRL, down, layoutmsg, preselect d
bind = SUPER + CTRL, up, layoutmsg, preselect u
bind = SUPER + CTRL, right, layoutmsg, preselect r

# Move focus with mainMod + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, down, movefocus, d
bind = SUPER, up, movefocus, u
bind = SUPER, right, movefocus, r

# Resize windows
binde = ALT + SUPER, left, resizeactive, -20 0
binde = ALT + SUPER, down, resizeactive, 0 20
binde = ALT + SUPER, up, resizeactive, 0 -20
binde = ALT + SUPER, right, resizeactive, 20 0

# Switch workspaces with mainMod + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
# bind = SUPER, 6, workspace, 6
# bind = SUPER, 7, workspace, 7
# bind = SUPER, 8, workspace, 8
# bind = SUPER, 9, workspace, 9
# bind = SUPER, 0, workspace, 10

# Move window under active workspace
bind = SUPER + SHIFT, left, movewindow, l
bind = SUPER + SHIFT, down, movewindow, d
bind = SUPER + SHIFT, up, movewindow, u
bind = SUPER + SHIFT, right, movewindow, r

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER + SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER + SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER + SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER + SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER + SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER + SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER + SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER + SHIFT, 8, movetoworkspacesilent, 8
bind = SUPER + SHIFT, 9, movetoworkspacesilent, 9
bind = SUPER + SHIFT, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
#bind = SUPER, S, togglespecialworkspace, magic
#bind = SUPER SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, +1
bind = SUPER, mouse_up, workspace, -1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Set volume up/down/mute and music using special keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop
