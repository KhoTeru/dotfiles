# ### Hprland config ### #

$HYPRDIR = ~/.config/hypr/hyprland

general {
        border_size = 2
        gaps_in = 5
        # bottom gap larger because shitty monitor
        gaps_out = 10,10,95,10
        col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
        col.inactive_border = rgba(595959aa)
        layout = dwindle
        allow_tearing = false
}

decoration {
        rounding = 10
        blur {
                enabled = true
                size = 3
                passes = 1
                vibrancy = 0.1696
        }
        active_opacity = 1.0
        inactive_opacity = 1.0
        fullscreen_opacity = 1.0
        shadow {
                color = rgba(1a1a1aee)
        }
}

input {
    kb_layout = us,es
    kb_model = pc105
        #kb_options = terminate:ctrl_alt_bksp
    sensitivity = 0.0
    accel_profile = adaptive
    follow_mouse = 1
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

group {
        focus_removed_window = true
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}


misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    enable_anr_dialog = false
}

cursor {
        no_warps = false
}

ecosystem {
        no_donation_nag = true
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# ## Monitor config

monitor=DP-2,1920x1080@165,0x0,1

# ## Sourcing files for environment variables, binds and programs at start

source = $HYPRDIR/env.conf
source = $HYPRDIR/binds.conf
source = $HYPRDIR/windowrules.conf
source = $HYPRDIR/autostart.conf
